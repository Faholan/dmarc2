[package]
name = "dmarc2"
version = "0.1.0"
edition = "2024"
description = "RFC 9990-compliant DMARC aggregate report parser"
license = "MIT"
keywords = ["dmarc", "email", "parser", "rfc9990", "xml"]
categories = ["parser-implementations"]
repository = "https://github.com/Faholan/dmarc2"
rust-version = "1.86.0"

[dependencies]
bitflags = "2.13.2"
quick-xml = { version = "0.42.0", features = ["serialize"] }
serde = { version = "1.0.229", features = ["derive"] }

[features]
strict = []
